# Configuration de fine-tuning LoRA pour whisper-large-v3
model:
  name: openai/whisper-large-v3
  language: fr           # fr, ar, en
  task: transcribe

data:
  train_manifest: data/finetuning/train_manifest.tsv
  val_manifest: data/finetuning/val_manifest.tsv

lora:
  enabled: true
  r: 16                  # rang LoRA
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: checkpoints/whisper-large-v3-lora
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 1.0e-4
  warmup_steps: 100
  epochs: 3
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  fp16: true
  gradient_checkpointing: true

evaluation:
  test_manifest: data/processed/fleurs_perturbed/manifest_perturbed.tsv
  output: results/tables/fleurs